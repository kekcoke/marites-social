name: Build and Test on Pull Request

on: 
  pull_request:
    branches:
      - main
    types:
      - closed

env:
  DB_HOST: localhost
  DB_PORT: 5432
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  DB_NAME: ${{ secrets.DB_NAME }}
  DB_USERNAME: ${{ secrets.DB_USERNAME }}
  DB_CONNECT_TIMEOUT: ${{ secrets.DB_CONNECT_TIMEOUT }}
  DB_SSL_MODE: ${{ secrets.DB_SSL_MODE }}
  JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
  JWT_ALGORITHM: ${{ secrets.JWT_ALGORITHM }}
  JWT_EXPIRES_MINUTES: ${{ secrets.JWT_EXPIRES_MINUTES }}
  OAUTH_TOKEN_URL: ${{ secrets.OAUTH_TOKEN_URL }}
  LOG_LEVEL: INFO
  DOCKER_REGISTRY: docker.io
  DOCKER_NAMESPACE: ${{ vars.DOCKER_HUB_USERNAME }}
  REPO_NAME: ${{ vars.REPO_NAME }}

jobs:
  test:
    name: Run Tests
    environment: development
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_USER: ${{ secrets.DB_USERNAME }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Pull Git Repository
        uses: actions/checkout@v5

      - name: Install Python version 3.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
  
      - name: Update pip
        run: python -m pip install --upgrade pip

      - name: Install All Dependencies
        run: pip install -r requirements.txt

      - name: Install app as a package
        run: pip install --no-cache-dir -e .

      - name: Run linting
        run: |
          pip install flake8
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true
      
      - name: Test with pytest
        run: |
          pip install pytest-cov
          pytest --cov=app --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          flags: unittests
          name: codecov-pr-${{ github.event.pull_request.number }}
        continue-on-error: true
      
      - name: Test Summary
        if: always()
        run: |
          echo "### Test Results 🧪" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **PR Number:** #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Python Version:** 3.9" >> $GITHUB_STEP_SUMMARY
          echo "- **Database:** PostgreSQL" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
  
  build-and-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_NAMESPACE }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and Push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_NAMESPACE }}/${{ env.REPO_NAME }}:latest
            ${{ env.DOCKER_NAMESPACE }}/${{ env.REPO_NAME }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Summary
        run: |
          echo "### 🐳 Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Registry** | ${{ env.DOCKER_REGISTRY }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | ${{ env.DOCKER_NAMESPACE }}/${{ env.REPO_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tags** | \`latest\`, \`pr-${{ github.event.pull_request.number }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Digest** | \`${{ steps.docker_build.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **PR Number** | #${{ github.event.pull_request.number }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pull command:**" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.DOCKER_NAMESPACE }}/${{ env.REPO_NAME }}:pr-${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  cleanup-on-merged:
    name: Cleanup Docker Images when PR merged
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event.pull_request.merged == true
    
    steps:
      - name: Obtain Docker Hub JWT
        id: docker-auth
        run: |
          TOKEN=$(curl -s -X POST https://hub.docker.com/v2/users/login/ \
            -H "Content-Type: application/json" \
            -d '{"username": "${{ env.DOCKER_NAMESPACE }}", "password": "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}"}' \
            | jq -r .token)
          echo "DOCKER_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Delete PR image tag from Docker Hub
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X DELETE \
            -H "Authorization: Bearer ${{ env.DOCKER_TOKEN }}" \
            https://hub.docker.com/v2/repositories/${{ env.DOCKER_NAMESPACE }}/${{ env.REPO_NAME }}/tags/pr-${{ github.event.pull_request.number }}/